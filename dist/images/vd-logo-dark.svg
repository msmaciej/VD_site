<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VortexDeep">
  <title>VortexDeep</title>

  <!-- Hexagon frame -->
  <polygon points="100,22 168,61 168,139 100,178 32,139 32,61"
           fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 6 network nodes at vertices -->
  <circle cx="100" cy="22"  r="5" fill="#0a0a0a"/>
  <circle cx="168" cy="61"  r="5" fill="#0a0a0a"/>
  <circle cx="168" cy="139" r="5" fill="#0a0a0a"/>
  <circle cx="100" cy="178" r="5" fill="#0a0a0a"/>
  <circle cx="32"  cy="139" r="5" fill="#0a0a0a"/>
  <circle cx="32"  cy="61"  r="5" fill="#0a0a0a"/>

  <!-- V monogram -->
  <polyline points="56,76 78,122 100,76"
            fill="none" stroke="#0a0a0a" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="miter"/>

  <!-- D monogram — vertical stroke -->
  <line x1="104" y1="76" x2="104" y2="122"
        stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>

  <!-- D monogram — right curve -->
  <path d="M 104,76 C 134,76 144,86 144,99 C 144,112 134,122 104,122"
        fill="none" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>
</svg>
