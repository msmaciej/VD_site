fragment SettingsParts on Settings {
  __typename
  siteName
  siteNameFont
  siteNameFontSize
  siteNameFontWeight
  subSiteName
  subSiteName_de
  subSiteNameFont
  subSiteNameFontSize
  subSiteNameFontWeight
  subSiteNameTracking
  showSubSiteNameOnly
  headerLayout
  headerLinksFontSize
  navLinks {
    __typename
    label
    label_de
    url
  }
  footerText
  showFooterLine
  footerTextFontSize
  socialLinks {
    __typename
    platform
    url
  }
  fontPreset
  customFontName
  showLogo
  theme
  baseTextColor
  customBackgroundColor
  headerHeight
  footerHeight
  headerInnerWidth
  siteUrl
  metaTitle
  metaTitle_de
  metaDescription
  metaDescription_de
  ogImage
  addressStreet
  addressCity
  addressPostal
  contactEmail
  contactPhone
}

fragment ArtParts on Art {
