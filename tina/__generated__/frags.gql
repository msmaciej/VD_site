fragment PageParts on Page {
  __typename
  blocks {
    __typename
    ... on PageBlocksSection {
      title
      titleFont
      titleFontSize
      titleFontWeight
      subTitle
      subTitleFont
      subTitleFontSize
      subTitleFontWeight
      content
      bodyFont
      fontSize
      fontWeight
      email
      showArt
      columns
      enabled
    }
    ... on PageBlocksProcessFlow {
      title
      titleFont
      titleFontSize
      titleFontWeight
      orientation
      stepFont
      stepFontSize
      stepFontWeight
      steps {
        __typename
        label
        font
        fontSize
        fontWeight
      }
      enabled
    }
    ... on PageBlocksCaseStudy {
      industry
      location
      package
      timeline
      challenge
      built
      result
      titleFont
      titleFontSize
      titleFontWeight
      bodyFont
      bodyFontSize
      bodyFontWeight
      labelFont
      labelFontSize
      labelFontWeight
      metaFont
      metaFontSize
      enabled
    }
  }
}

